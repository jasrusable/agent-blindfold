name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04: setup-python has no 3.9 for ubuntu-latest (26.04).
        os: [ubuntu-24.04, macos-latest]
        python: ["3.9", "3.11", "3.13"]
        zsh: [true]
        include:
          # A Linux box without zsh (like a fresh Debian): its tests must skip, not error.
          - os: ubuntu-24.04
            python: "3.13"
            zsh: false
    name: test (${{ matrix.os }}, ${{ matrix.python }}${{ !matrix.zsh && ', no zsh' || '' }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The Bash-wrapper tests run under both bash and zsh (Claude Code uses either).
      - if: runner.os == 'Linux' && matrix.zsh
        run: sudo apt-get install -y -q zsh
      - if: runner.os == 'Linux' && !matrix.zsh
        run: "! command -v zsh"
      - run: python -m unittest discover -s tests -t . -v
        env:
          BLINDFOLD_FUZZ_ITERATIONS: "2000"
