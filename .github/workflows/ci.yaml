name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The Bash-wrapper tests run under both bash and zsh (Claude Code uses either).
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y -q zsh
      - run: python -m unittest discover -s tests -t . -v
        env:
          BLINDFOLD_FUZZ_ITERATIONS: "2000"
